    <path d="M20-30 L26-24 L36-36" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- PSC text -->
  <text x="96" y="148" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="700" fill="white" letter-spacing="4">PSC</text>
