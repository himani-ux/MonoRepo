<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>VIMS Maintenance</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f7f8fa;
        color: #1f2937;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(520px, 100%);
        border: 1px solid #d1d5db;
        background: #ffffff;
        padding: 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.25;
        font-weight: 700;
      }

      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.6;
      }

      p + p {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>VIMS is under scheduled maintenance.</h1>
      <p>Estimated return: to be confirmed by KSM Corporate IT.</p>
      <p>Please try again after the maintenance window ends.</p>
    </main>
  </body>
</html>
